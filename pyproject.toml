[project]
name = "vantablack-schemas"
version = "0.1.7"
description = "Shared Pydantic schemas for VantaBlack Core / EXE / PM (IntentBlock + related models)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "VantaBlack", email = "noreply@anthropic.com" },
]
dependencies = [
    "pydantic>=2.5.0,<3",
    "jsonschema>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "ruff>=0.5,<0.15",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["UP042"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vantablack_schemas"]

[tool.hatch.build.targets.wheel.force-include]
"contracts/strategy_engine_wire_message.v1.schema.json" = "vantablack_schemas/contracts/strategy_engine_wire_message.v1.schema.json"

[tool.hatch.build.targets.sdist]
include = [
    "src/vantablack_schemas",
    "contracts/strategy_engine_wire_message.v1.schema.json",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
