name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      - run: ruff check src/vantablack_schemas/strategy_engine_wire.py tests/test_strategy_engine_wire_contract.py
      - run: ruff format --check src/vantablack_schemas/strategy_engine_wire.py tests/test_strategy_engine_wire_contract.py
      - run: pytest
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/vb-schemas-wheel
      - run: python -m pip install --force-reinstall --no-deps /tmp/vb-schemas-wheel/*.whl
      - run: cd /tmp && python -c "from vantablack_schemas.strategy_engine_wire import _wire_validator; _wire_validator()"
